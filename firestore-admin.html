<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Tech Hub | Firestore Admin</title><link rel="stylesheet" href="firestore-admin.css"></head><body><div id="gate" class="gate"><div class="gatebox"><h1>Alpha Tech Hub</h1><p id="gateStatus">Verifying admin access…</p></div></div><div id="app" hidden><aside class="sidebar"><h2>Alpha Tech Hub</h2><small>FIRESTORE ADMIN</small><nav><button data-view="overview" class="selected">Overview</button><button data-view="clients">Clients</button><button data-view="projects">Projects</button><button data-view="requests">Requests</button></nav><button id="logout">Sign out</button></aside><main><header><h1 id="heading">Overview</h1><span id="adminEmail"></span></header><section id="overview" class="view"><div class="stats"><article><small>Clients</small><b id="clientCount">—</b></article><article><small>Projects</small><b id="projectCount">—</b></article><article><small>Active Projects</small><b id="activeCount">—</b></article><article><small>Requests</small><b id="requestCount">—</b></article></div><p class="hint">This new dashboard reads from Cloud Firestore, not Realtime Database.</p><p id="adminNotice" class="hint" role="status"></p></section><section id="clients" class="view" hidden><div class="toolbar"><input id="clientSearch" placeholder="Search client name/email"><button id="refreshClients">Refresh</button></div><div id="clientsList" class="list"></div></section><section id="projects" class="view" hidden><form id="projectForm" class="panel"><h2>Create project</h2><label>Project name<input id="pName" required></label><label>Client UID<input id="pClientUid" required placeholder="Client Firebase UID"></label><label>Client name<input id="pClientName"></label><label>Description<textarea id="pDesc"></textarea></label><div class="two"><label>Status<select id="pStatus"><option>Planning</option><option>In progress</option><option>On hold</option><option>Completed</option></select></label><label>Progress %<input id="pProgress" type="number" min="0" max="100" value="0"></label></div><label>Deadline<input id="pDeadline" type="date"></label><button>Create project</button><p id="projectMessage"></p></form><div id="projectsList" class="list"></div></section><section id="requests" class="view" hidden><div id="requestsList" class="list"></div></section></main></div><script type="module" src="firestore-admin.js"></script></body></html>
