<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#167a45">
<title>Client Portal | Alpha Tech Hub</title>
<link rel="stylesheet" href="style.css">
<style>
.portal{padding:42px 0 75px}.portal-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:25px}.portal-head h1{font-size:clamp(28px,5vw,42px);margin:8px 0}.portal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.portal-card{padding:22px;border:1px solid var(--border);border-radius:17px;background:var(--card);min-width:0}.portal-card h2{font-size:18px;margin:0 0 14px}.portal-list{display:grid;gap:12px}.portal-item{padding:15px;border:1px solid var(--border);border-radius:12px;overflow-wrap:anywhere}.portal-item strong{display:block;margin-bottom:6px}.portal-item small,.muted{color:var(--muted)}.portal-status{display:inline-block;padding:4px 9px;border-radius:30px;background:#1d4935;color:#b8f0cf;font-size:12px}.bar{height:8px;border-radius:20px;background:var(--border);overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:var(--gradient)}#portalMessage{padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:18px;color:var(--muted)}@media(max-width:650px){.portal-grid{grid-template-columns:1fr}.portal{padding-top:28px}.portal-card{padding:18px}}
</style>
</head>
<body>
<header class="site-header"><div class="container navbar"><a href="index.html" class="brand"><span class="brand-icon">A</span><span class="brand-text"><strong>Alpha Tech Hub</strong><small>BUILD. DESIGN. GROW.</small></span></a><div style="display:flex;gap:9px"><a href="dashboard.html" class="btn btn-outline">Old dashboard</a><button id="portalLogout" class="btn btn-primary" type="button">Sign out</button></div></div></header>
<main class="portal"><div class="container">
<div id="portalMessage" role="status" aria-live="polite">Checking your account…</div>
<section class="portal-head"><div><span class="section-label">CLIENT PORTAL</span><h1>Welcome, <span id="portalName" class="gradient-text">Client</span></h1><p class="muted" id="portalEmail"></p></div></section>
<div class="portal-grid">
<section class="portal-card"><h2>My Projects</h2><div id="portalProjects" class="portal-list"><p class="muted">Loading projects…</p></div></section>
<section class="portal-card"><h2>My Payments</h2><div id="portalPayments" class="portal-list"><p class="muted">Loading payments…</p></div></section>
<section class="portal-card"><h2>Account details</h2><div id="portalProfile" class="portal-list"></div></section>
<section class="portal-card"><h2>Need help?</h2><p class="muted">Contact Alpha Tech Hub about your project, invoice or account.</p><p><a class="btn btn-primary" href="https://wa.me/2349157775791" target="_blank" rel="noopener noreferrer">Contact support</a></p></section>
</div></div></main>
<script type="module" src="firestore-client.js"></script>
</body></html>
